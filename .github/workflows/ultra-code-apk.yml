name: Build Ultra Code Ultimate APK

on:
  push:
    branches: ["main"]
    paths:
      - "ultra-code-android/**"
      - ".github/workflows/ultra-code-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Ultra Code Ultimate debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ultra-code-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ultra-Code-Ultimate-debug-apk
          path: ultra-code-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
